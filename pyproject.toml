[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hmfashion"
version = "0.1.0"
description = "HM Data Lab: independent fashion retail analytics using historical H&M dataset data"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0,<2",
    "pandas>=2.0,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.11,<2",
    "plotly>=5.20,<7",
    "streamlit>=1.40,<2",
    "joblib>=1.3,<2",
    "requests>=2.31,<3",
]

[project.scripts]
hmfashion = "hmfashion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
